services:
  - type: web
    name: prism-api
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: APP_ORIGIN
        value: https://prism-app.onrender.com
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: info@prims.com
      - key: ADMIN_PASSWORD
        sync: false

  - type: web
    name: prism-app
    runtime: static
    repo: https://github.com/techyogicodes3-boop/prime_frontend.git
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://prism-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
